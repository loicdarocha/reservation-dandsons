<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Propositions de bandeau</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--lave:#c4572a;--fonce:#9b4220;--encre:#2a1f1a}
body{margin:0;font:400 15px/1.4 "Plus Jakarta Sans",system-ui,sans-serif;color:var(--encre);background:#fbf8f5;position:relative;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(251,248,245,.86),rgba(251,248,245,.9)),url("https://images.unsplash.com/photo-1662901519019-ad5e7c5d7502?auto=format&fit=crop&w=1800&q=60") center/cover}
.n{margin:34px 24px 8px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#7a6a60}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px}
.pill{display:flex;gap:4px;border-radius:999px;padding:5px;font-size:13px;font-weight:600}
.pill span{padding:8px 16px;border-radius:999px}
.tel{border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px}
/* 1 Sable */
.v1{background:rgba(251,246,240,.72);backdrop-filter:blur(14px);border-bottom:1px solid rgba(196,87,42,.18)}
.v1 .logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--encre)}
.v1 .mot{display:flex;flex-direction:column;line-height:1}
.v1 .mot b{font:600 26px/1 "Fraunces",Georgia,serif;letter-spacing:-.01em}
.v1 .mot small{font-size:10.5px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:var(--lave);margin-top:4px}
.v1 .pill{background:rgba(255,255,255,.55);border:1px solid rgba(42,31,26,.1)}
.v1 .pill .on{background:var(--encre);color:#fff}
.v1 .tel{border:1px solid rgba(42,31,26,.18);background:rgba(255,255,255,.5)}
/* 2 Basalte */
.v2{background:rgba(32,24,20,.88);backdrop-filter:blur(14px);color:#f6efe8}
.v2 .logo{display:flex;align-items:center;gap:12px;color:#f6efe8}
.v2 .mot{font:500 30px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.02em}
.v2 .mot i{font-style:normal;color:#e48a5c}
.v2 .pill{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.v2 .pill span{color:#d8cdc4}.v2 .pill .on{background:var(--lave);color:#fff}
.v2 .tel{border:1px solid rgba(255,255,255,.25);color:#f6efe8}
/* 3 Transparent */
.v3{background:linear-gradient(180deg,rgba(251,248,245,.92),rgba(251,248,245,.6));backdrop-filter:blur(10px)}
.v3 .logo{display:flex;align-items:center;gap:10px}
.v3 .mot{font:800 20px/1 "Plus Jakarta Sans",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--encre)}
.v3 .mot span{display:block;font:500 italic 15px/1.1 "Fraunces",Georgia,serif;letter-spacing:0;text-transform:none;color:var(--lave);margin-top:2px}
.v3 .pill{background:transparent}.v3 .pill span{color:#5b4c43}.v3 .pill .on{background:transparent;color:var(--lave);box-shadow:inset 0 -2px 0 var(--lave);border-radius:0}
.v3 .tel{background:var(--lave);color:#fff}
@media (max-width:700px){header{flex-wrap:wrap}.pill{order:3;width:100%;justify-content:space-between}}
</style></head><body>
<p class="n">Proposition A · Sable</p>
<header class="v1"><a class="logo"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#c4572a"/><path d="M6 29 15.5 15h3l1.5 2 1.5-2h3L34 29z" fill="#fbf6f0"/><circle cx="27" cy="11" r="3" fill="#fbf6f0" opacity=".9"/></svg><span class="mot"><b>Escapades</b><small>Auvergne</small></span></a>
<div class="pill"><span class="on">Toutes</span><span>Cournon</span><span>Aubière</span><span>Royat</span></div><span class="tel">06 15 27 25 45</span></header>

<p class="n">Proposition B · Basalte</p>
<header class="v2"><a class="logo"><svg width="38" height="34" viewBox="0 0 38 34" aria-hidden="true"><path d="M1 33 14 12h4l1.5 2.5L21 12h4l12 21z" fill="none" stroke="#e48a5c" stroke-width="2.2" stroke-linejoin="round"/><path d="M16 8c1-2 3-2.5 3.5-5.5 1.2 2 .8 3.8-.2 5.4" fill="none" stroke="#e48a5c" stroke-width="2" stroke-linecap="round"/></svg><span class="mot">Escapades <i>Auvergne</i></span></a>
<div class="pill"><span class="on">Toutes</span><span>Cournon</span><span>Aubière</span><span>Royat</span></div><span class="tel">06 15 27 25 45</span></header>

<p class="n">Proposition C · Épurée</p>
<header class="v3"><a class="logo"><svg width="34" height="28" viewBox="0 0 34 28" aria-hidden="true"><path d="M0 28 10 10l4 5 5-9 15 22z" fill="#2a1f1a"/><path d="M14 15l5-9 4 6.5-3 2-2.5-2.5z" fill="#c4572a"/></svg><span class="mot">Escapades<span>en Auvergne</span></span></a>
<div class="pill"><span class="on">Toutes</span><span>Cournon</span><span>Aubière</span><span>Royat</span></div><span class="tel">06 15 27 25 45</span></header>
<div style="height:300px"></div>
</body></html>
